# Render Blueprint for RekAI — provisions Redis + API + Web in one deploy.
# Docs: https://render.com/docs/blueprint-spec
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# "New +" → "Blueprint" and point it at the repo. Render reads this file.
#
# Note: Render renamed managed Redis to "Key Value". If your account rejects
# `type: redis`, change it to `type: keyvalue` (the rest is identical).

services:
  # --- Redis (cache + persisted metrics) ---
  - type: redis
    name: rekai-redis
    plan: free
    ipAllowList: [] # internal connections only
    maxmemoryPolicy: allkeys-lru

  # --- API (FastAPI) ---
  - type: web
    name: rekai-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: REKAI_REDIS_URL
        fromService:
          type: redis
          name: rekai-redis
          property: connectionString
      # Render services are internet-facing, so run in production mode: the
      # open-proxy guard then *refuses to boot* a deployment that sets
      # server-side provider keys without gateway auth, rather than only
      # logging a warning. See apps/api/.env.example for the exact rule.
      - key: REKAI_ENVIRONMENT
        value: production
      # "*" is acceptable here — RekAI uses Bearer keys, not ambient
      # credentials, so a foreign origin can neither spend nor read without a
      # key. Pin it to the web origin anyway once the URL settles, e.g.
      # https://rekai-web.onrender.com.
      - key: REKAI_CORS_ORIGINS
        value: "*"
      # Optional server-side keys (otherwise users supply their own via BYOK).
      # With REKAI_ENVIRONMENT=production these require gateway auth — set
      # REKAI_API_KEYS (or REKAI_DYNAMIC_KEYS_ENABLED) too, or the API refuses
      # to start rather than serve as an open proxy for your provider keys.
      # - key: REKAI_API_KEYS
      #   value: sk-rekai-...
      # - key: REKAI_OPENAI_API_KEY
      #   sync: false

  # --- Web (Next.js) ---
  - type: web
    name: rekai-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    envVars:
      # Baked into the client bundle at build time (must be the API's public URL).
      # Render service URLs are predictable: https://<name>.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://rekai-api.onrender.com
