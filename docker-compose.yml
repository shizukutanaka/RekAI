services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      REKAI_REDIS_URL: redis://redis:6379/0
      REKAI_CORS_ORIGINS: "*"
      # Provide a server-side key here, or use BYOK via the X-Provider-Key header.
      REKAI_OPENAI_API_KEY: ${REKAI_OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
