[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rekai"
version = "1.3.0"
description = "RekAI — a lightweight AI router & gateway with provider abstraction, caching and BYOK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RekAI contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    # Used only by tests/test_openai_sdk_e2e.py to prove drop-in compatibility
    # with the real OpenAI SDK; those tests skip if it isn't installed.
    "openai>=1.40",
    # Same idea for tests/test_langchain_e2e.py. LangChain is named in the
    # README's compatibility promise alongside the OpenAI SDK, and it is not the
    # same test: ChatOpenAI sends fields the plain SDK doesn't and maps the
    # response through its own AIMessage. Skips when absent.
    "langchain-openai>=0.2",
    # NOT a runtime dependency. rekai/semantic_cache.py uses NumPy for its
    # similarity scan when it happens to be installed (~100x on that loop) and
    # falls back to pure Python otherwise; this is here so the test suite
    # exercises the accelerated path and proves the two agree.
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/shizukutanaka/RekAI"
Repository = "https://github.com/shizukutanaka/RekAI"

[tool.setuptools.packages.find]
include = ["rekai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: FastAPI uses function calls (Depends/Header) in argument defaults by design.
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false

# `python_version` above is the supported floor, and it is deliberate — it is
# what keeps `requires-python = ">=3.10"` honest. But mypy applies that version
# to *third-party stubs* too, and numpy's shipped `.pyi` uses the PEP 695 `type`
# statement, which is 3.12 syntax. So a CI runner that resolves a current numpy
# fails with a syntax error inside numpy itself, before checking any RekAI code
# at all. That is not hypothetical: it is why this repo's CI had never once been
# green, on main or on any branch (numpy 2.5.2 + mypy 2.3.1).
#
# Skipping the import is the right scope rather than a workaround: numpy is an
# optional accelerator here — `semantic_cache.py` imports it in a try/except and
# already carries `type: ignore[import-not-found]`, so it is `Any` to mypy
# either way. Pinning numpy instead would fight the ecosystem forever; raising
# `python_version` would silently drop the 3.10 guarantee.
# `python_version` above is the supported floor, and it is deliberate: it is what
# keeps `requires-python = ">=3.10"` honest. But mypy applies that version to
# *third-party stubs* too, and numpy's shipped `__init__.pyi` uses the PEP 695
# `type` statement, which is 3.12 syntax. A CI runner that resolves a current
# numpy therefore dies with a syntax error inside numpy itself, before checking
# a single line of RekAI. That is not hypothetical — it is why this repo's CI had
# never once been green, on main or on any branch (numpy 2.5.2, mypy 2.3.1).
#
# Skipping numpy is the right scope rather than a workaround: it is an optional
# accelerator here. `semantic_cache.py` imports it in a try/except and already
# carries `type: ignore[import-not-found]`, so it is `Any` to mypy either way,
# and nothing in RekAI loses type checking. Pinning numpy instead would mean
# fighting the ecosystem forever; raising `python_version` would silently drop
# the 3.10 guarantee.
#
# Both settings are needed. `follow_imports` alone does not apply to stub files,
# so without `follow_imports_for_stubs` mypy still parses the .pyi and still
# reports the syntax error (verified against the CI configuration).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
