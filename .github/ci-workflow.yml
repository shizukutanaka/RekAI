name: CI

on:
  push:
    # `claude/**` too: the work happens on those branches, and CI that only
    # runs after merge is feedback that arrives too late to act on.
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, type-check, test) · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two ends of the supported range: the `requires-python = ">=3.10"`
        # floor, and the version the shipped Docker image actually runs. Both
        # were verified green locally (645 tests) before this matrix was added,
        # so a failure here is a real regression rather than a known gap.
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check rekai tests

      - name: mypy
        run: mypy rekai

      - name: pytest
        run: python -m pytest -q

  python-sdk:
    name: Python SDK (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -q

  js-sdk:
    name: JS SDK (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: test
        run: npm test

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: vitest
        run: npx vitest run

      - name: build
        run: npm run build

  e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API (into apps/api/.venv, used by e2e/helpers/api-server.ts)
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: apps/web
        run: npm run e2e

  stack:
    # The only job that exercises what users actually run: the compose file and
    # both Dockerfiles. Agent sessions on this repo have no Docker daemon, so
    # nothing else can build-verify the images — a broken Dockerfile or an
    # unhealthy container would otherwise reach a release unnoticed. It also
    # covers scripts/smoke.sh, which is a shipped, documented entry point
    # (`make smoke`) and not just a test helper.
    name: Stack (compose build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose
        run: docker compose config -q

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Smoke-test the running API
        run: scripts/smoke.sh http://localhost:8000

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
